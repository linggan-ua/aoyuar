<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>温柔正弦铃 · 存档预设</title>
<style>
  :root{--bg:#0b0e13;--panel:#141922;--line:#232b38;--text:#e8eef6;--dim:#8b98a9;--accent:#7fd1ff;--accent2:#ffd479}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font:14px/1.7 -apple-system,"PingFang SC",sans-serif;
       display:flex;justify-content:center;padding:40px 20px}
  .wrap{width:100%;max-width:760px}
  h1{font-size:20px;margin:0 0 6px;font-weight:600}
  .sub{color:var(--dim);font-size:13px;margin-bottom:26px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px 24px;margin-bottom:18px}
  h2{font-size:13px;color:var(--accent);margin:0 0 14px;letter-spacing:1px;font-weight:600}
  .notes{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
  button{background:#1d2632;color:var(--text);border:1px solid var(--line);border-radius:10px;
         padding:10px 18px;font-size:14px;cursor:pointer}
  button:hover{border-color:var(--accent);color:var(--accent)}
  button.primary{background:var(--accent);color:#06202e;border-color:var(--accent);font-weight:600}
  .notes button{width:64px;padding:14px 0;text-align:center;font-size:15px}
  table{width:100%;border-collapse:collapse;font-size:13px}
  td{padding:6px 0;border-bottom:1px solid #1c2430}
  td:first-child{color:var(--dim);width:52%}
  td:last-child{text-align:right;color:var(--accent2);font-variant-numeric:tabular-nums}
  canvas{width:100%;height:110px;background:#0e131b;border-radius:10px;border:1px solid var(--line)}

  /* --- 钢琴卷帘 --- */
  .rollwrap{position:relative}
  .roll{position:relative;background:#0e131b;border:1px solid var(--line);border-radius:10px;overflow:hidden;
        touch-action:none;user-select:none;-webkit-user-select:none}
  .rollhead{display:flex;height:22px;border-bottom:1px solid var(--line)}
  .rollhead .lab{flex:0 0 56px}
  .rollhead .steps{flex:1;display:flex}
  .rollhead .steps span{flex:1;line-height:21px;text-align:center;font-size:11px;color:var(--dim);border-left:1px solid #1a2230}
  .rollhead .steps span.beat{color:var(--accent);border-left-color:#2b3646}
  .rollbody{position:relative}
  .row{display:flex;height:20px;border-top:1px solid #161d28}
  .row:first-child{border-top:0}
  .row .lab{flex:0 0 56px;display:flex;align-items:center;justify-content:flex-end;padding-right:6px;
            font-size:10px;color:var(--dim);letter-spacing:.3px}
  .row.black .lab{color:#5a687a}
  .row .cells{flex:1;display:flex}
  .row.hit{background:rgba(127,209,255,.10)}
  .row.hit .lab{color:var(--accent)}
  .cell{flex:1;min-width:0;padding:0;border:0;border-left:1px solid #161d28;border-radius:0;background:transparent;cursor:pointer}
  .cell.beat{border-left-color:#26313f}
  .row.black .cell{background:rgba(255,255,255,.014)}
  .cell:hover{background:#1b2431}
  .cell.on{background:var(--accent);box-shadow:0 0 8px rgba(127,209,255,.45)}
  .cell.on:hover{background:#a5e0ff}
  .playhead{position:absolute;top:0;bottom:0;width:2px;background:var(--accent);opacity:.9;pointer-events:none;display:none}
  .rollctl{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
  .rollctl button{padding:8px 14px}
  .rollctl .tag{color:var(--dim);font-size:12px;font-variant-numeric:tabular-nums}
  select{background:#1d2632;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:7px 10px;font-size:13px}
  input[type=range]{width:130px;accent-color:var(--accent)}
  .hint{color:var(--dim);font-size:12px;margin-top:12px;line-height:2}
  kbd{background:#1d2632;border:1px solid var(--line);border-radius:5px;padding:1px 6px;font-size:11px;color:var(--accent2)}
  pre{background:#0e131b;border:1px solid var(--line);border-radius:10px;padding:14px;font-size:12px;color:#9fd3a0;overflow:auto}
</style>
</head>
<body>
<div class="wrap">
  <h1>温柔正弦铃 · 存档预设</h1>
  <div class="sub">2026-09-20 定稿 · 用于「鳌鱼 AR」小程序点击鱼身的音效 · 参数已内置，双击本文件即可播放</div>

  <div class="card">
    <h2>试听</h2>
    <div class="notes" id="kb"></div>
    <button class="primary" id="scale">播放整条音阶</button>
    <button id="repeat">连奏 5 次</button>
  </div>


  <div class="card">
    <h2>钢琴卷帘 · 任意音高演奏</h2>
    <div class="rollctl">
      <button class="primary" id="rollplay">播放</button>
      <button id="rollclear">清空</button>
      <select id="rollrange">
        <option value="48">C3 – C5</option>
        <option value="60">C4 – C6</option>
        <option value="72" selected>C5 – C7</option>
        <option value="84">C6 – C8</option>
      </select>
      <input type="range" id="rollbpm" min="50" max="200" step="5" value="100">
      <span class="tag" id="rollbpmtag">100 BPM · 每格 16 分音符</span>
      <span class="tag" id="rollready"></span>
      <span class="tag" id="rolllast"></span>
    </div>
    <div class="rollwrap">
      <div class="roll" id="roll">
        <div class="rollhead"><div class="lab"></div><div class="steps" id="rollsteps"></div></div>
        <div class="rollbody" id="rollbody"></div>
      </div>
    </div>
    <div class="hint">
      点格子写音符，同一个格子再点一次删掉（点下去就会响）。按住鼠标上下拖动可以滑奏任意音高。<br>
      电脑键盘实时演奏：<kbd>Z</kbd><kbd>S</kbd><kbd>X</kbd><kbd>D</kbd><kbd>C</kbd><kbd>V</kbd><kbd>G</kbd><kbd>B</kbd><kbd>H</kbd><kbd>N</kbd><kbd>J</kbd><kbd>M</kbd> 低八度，<kbd>Q</kbd><kbd>2</kbd><kbd>W</kbd><kbd>3</kbd><kbd>E</kbd><kbd>R</kbd><kbd>5</kbd><kbd>T</kbd><kbd>6</kbd><kbd>Y</kbd><kbd>7</kbd><kbd>U</kbd> 高八度。切换音域会清空卷帘。
    </div>
  </div>

  <div class="card">
    <h2>包络曲线</h2>
    <canvas id="cv" width="1400" height="220"></canvas>
  </div>

  <div class="card">
    <h2>音色参数</h2>
    <table id="tb"></table>
  </div>

  <div class="card">
    <h2>原始 JSON（可直接粘回调音台修改）</h2>
    <pre id="json"></pre>
  </div>
</div>
<script>
// ===== 定稿参数 =====
const PRESET = {
  "root": "A", "octave": 6,
  "attack": 0.002, "attackCurve": 2,
  "bloomAmount": 0.014, "bloomTau": 0.04,
  "fastPart": 1, "fastTau": 0.27, "slowTau": 1,
  "duration": 2.5, "release": 0.35,
  "detune": 0, "dry": 0.9,
  "reverb": 0.85, "preDelay": 0.03,
  "reverbTail": 1.35, "reverbDensity": 3,
  "reverbDecay": 0.35, "reverbTone": 0.7,
  "reverbWidth": 1.06, "reverbSpread": 4,
  "peak": 0.2,
  "p2mult": 1, "p2amp": 2,
  "p3mult": 1, "p3amp": 2
};
const P = PRESET;
const SCALE = [['C',1046.50],['D',1174.66],['E',1318.51],['G',1567.98],['A',1760.00]];
const DIFFUSE = [0.0043,0.0067,0.0091,0.0127,0.0173,0.0229,0.0281];
const SR = 44100;

let ctx = null;
function audio(){ if(!ctx) ctx = new (window.AudioContext||window.webkitAudioContext)();
  if(ctx.state==='suspended') ctx.resume(); return ctx; }

function render(freq){
  const sr = SR, n = Math.floor(sr*P.duration);
  const attack = Math.max(1, Math.floor(sr*P.attack));
  const release = Math.max(1, Math.floor(sr*P.release));
  const L = new Float32Array(n), R = new Float32Array(n);
  let pl = 0, pr = 0;
  for(let i=0;i<n;i++){
    const t = i/sr;
    const decay = P.fastPart*Math.exp(-t/P.fastTau) + (1-P.fastPart)*Math.exp(-t/P.slowTau);
    let env = 1;
    if(i<attack) env = Math.pow(i/attack, P.attackCurve);
    if(i>n-release) env *= 0.5-0.5*Math.cos(Math.PI*(n-i)/release);
    const r = t/P.bloomTau;
    const bloom = 1 + P.bloomAmount*r*Math.exp(1-r);
    pl += 2*Math.PI*freq*(1-P.detune)*bloom/sr;
    pr += 2*Math.PI*freq*(1+P.detune)*bloom/sr;
    const a = decay*env;
    let vl = Math.sin(pl)*a, vr = Math.sin(pr)*a;
    if(P.p2amp>0){ const a2 = P.p2amp*Math.exp(-t/P.fastTau)*env;
      vl += a2*Math.sin(pl*P.p2mult); vr += a2*Math.sin(pr*P.p2mult); }
    if(P.p3amp>0){ const a3 = P.p3amp*Math.exp(-t/P.slowTau)*env;
      vl += a3*Math.sin(pl*P.p3mult); vr += a3*Math.sin(pr*P.p3mult); }
    L[i]=vl; R[i]=vr;
  }
  if(P.reverb>0 && (P.dry+P.reverb)>0){
    const wetL = new Float32Array(n), wetR = new Float32Array(n);
    const taps = Math.max(2, Math.round(P.reverbDensity));
    const base = (0.008 + 0.014*P.reverbTail)*P.reverbSpread;
    for(let k=0;k<taps;k++){
      const d = Math.max(1, Math.floor(base*(1+k*0.41)*sr));
      const g = P.reverbDecay*(0.85 + 0.3*((k*7)%5)/4);
      for(let i=d;i<n;i++){
        wetL[i] += (L[i-d]+wetL[i-d])*g;
        wetR[i] += (R[i-d]+wetR[i-d])*g;
      }
    }
    for(let k=0;k<DIFFUSE.length;k++){
      const d = Math.max(1, Math.floor(DIFFUSE[k]*sr));
      const g = 0.62 - k*0.04;
      const tl = Float32Array.from(wetL), tr = Float32Array.from(wetR);
      for(let i=d;i<n;i++){
        wetL[i] = -g*tl[i] + tl[i-d] + g*wetL[i-d];
        wetR[i] = -g*tr[i] + tr[i-d] + g*wetR[i-d];
      }
    }
    const cut = 300 + 12000*P.reverbTone;
    const alpha = 1 - Math.exp(-2*Math.PI*cut/sr);
    let sl=0, sr2=0;
    const pre = Math.floor(P.preDelay*sr);
    const norm = 1/Math.sqrt(taps);
    for(let i=0;i<n;i++){
      sl += alpha*(wetL[i]-sl); sr2 += alpha*(wetR[i]-sr2);
      let wl = sl*norm, wr = sr2*norm;
      const mid=(wl+wr)/2, side=(wl-wr)/2*P.reverbWidth;
      wl = mid+side; wr = mid-side;
      const idx = i+pre;
      if(idx<n){ L[idx] = L[idx]*P.dry + wl*P.reverb; R[idx] = R[idx]*P.dry + wr*P.reverb; }
    }
  } else {
    for(let i=0;i<n;i++){ L[i]*=P.dry; R[i]*=P.dry; }
  }
  let pk=0;
  for(let i=0;i<n;i++) pk = Math.max(pk, Math.abs(L[i]), Math.abs(R[i]));
  const s = pk>0 ? P.peak/pk : 1;
  const buf = audio().createBuffer(2, n, sr);
  const cl = buf.getChannelData(0), cr = buf.getChannelData(1);
  for(let i=0;i<n;i++){ cl[i]=L[i]*s; cr[i]=R[i]*s; }
  return buf;
}

const CACHE = {};
function play(freq){
  if(!CACHE[freq]) CACHE[freq] = render(freq);
  const src = audio().createBufferSource();
  src.buffer = CACHE[freq]; src.connect(audio().destination); src.start();
}

const LABELS = {
  attack:['起音', v=>(v*1000).toFixed(0)+' ms'],
  attackCurve:['起音曲线', v=>'^'+v.toFixed(2)],
  bloomAmount:['音高滑音量', v=>(v*100).toFixed(1)+' %'],
  bloomTau:['滑音达峰时间', v=>(v*1000).toFixed(0)+' ms'],
  fastPart:['快速段占比', v=>(v*100).toFixed(0)+' %'],
  fastTau:['快速衰减', v=>v.toFixed(2)+' s'],
  slowTau:['慢速衰减', v=>v.toFixed(2)+' s'],
  duration:['总时长', v=>v.toFixed(2)+' s'],
  release:['末尾淡出', v=>(v*1000).toFixed(0)+' ms'],
  detune:['干声左右失谐', v=>(v*1000).toFixed(2)+' ‰'],
  dry:['干声电平', v=>(v*100).toFixed(0)+' %'],
  reverb:['混响电平', v=>(v*100).toFixed(0)+' %'],
  preDelay:['混响预延迟', v=>(v*1000).toFixed(0)+' ms'],
  reverbTail:['混响尾巴长度', v=>v.toFixed(2)+' ×'],
  reverbDensity:['混响密度', v=>v+' 路'],
  reverbDecay:['混响衰减', v=>v.toFixed(2)],
  reverbTone:['混响音色', v=>(v*100).toFixed(0)+' %'],
  reverbWidth:['混响宽度', v=>'×'+v.toFixed(2)],
  reverbSpread:['延迟扩散', v=>'×'+v.toFixed(2)],
  peak:['峰值电平', v=>v.toFixed(2)],
  p2mult:['分层 2 倍数', v=>'×'+v.toFixed(2)],
  p2amp:['分层 2 幅度', v=>(v*100).toFixed(0)+' %'],
  p3mult:['分层 3 倍数', v=>'×'+v.toFixed(2)],
  p3amp:['分层 3 幅度', v=>(v*100).toFixed(0)+' %']
};
const tb = document.getElementById('tb');
for(const k in LABELS){
  if(!(k in P)) continue;
  const tr = document.createElement('tr');
  tr.innerHTML = '<td>'+LABELS[k][0]+'</td><td>'+LABELS[k][1](P[k])+'</td>';
  tb.appendChild(tr);
}
document.getElementById('json').textContent = JSON.stringify(PRESET, null, 2);

const kb = document.getElementById('kb');
SCALE.forEach(([name, f]) => {
  const b = document.createElement('button');
  b.textContent = name + '6';
  b.onclick = () => play(f);
  kb.appendChild(b);
});
document.getElementById('scale').onclick = () => SCALE.forEach(([,f],i) => setTimeout(()=>play(f), i*280));
document.getElementById('repeat').onclick = () => {
  for(let r=0;r<5;r++) setTimeout(()=>play(SCALE[Math.floor(Math.random()*SCALE.length)][1]), r*380);
};


/* ===== 钢琴卷帘：任意音高演奏 ===== */
const NOTE_NAMES = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const BLACK = [1,3,6,8,10];
const ROLL_STEPS = 16;         // 横向一小节 16 个十六分音符
const GUT = 56;                // 左侧音名栏宽度，和 CSS 的 .lab 保持一致
const KEY_LOW  = 'zsxdcvgbhnjm,';   // 低八度：C C# D D# E F F# G G# A A# B C
const KEY_HIGH = 'q2w3er5t6y7ui';   // 高八度：同上一组 +12

const midiFreq = (m) => 440 * Math.pow(2, (m - 69) / 12);
const midiName = (m) => NOTE_NAMES[m % 12] + (Math.floor(m / 12) - 1);

let rollLow = 72, rollRows = 25, rollBpm = 100;
let pattern = {};
let loopTimer = null, loopStart = 0, loopLast = -1, loopOn = false;
let dragRow = null, preToken = 0, audioReady = false;

const rollBody = document.getElementById('rollbody');
const headLine = document.createElement('div');
headLine.className = 'playhead';

function buildRoll(){
  rollBody.innerHTML = '';
  for(let m = rollLow + rollRows - 1; m >= rollLow; m--){
    const row = document.createElement('div');
    row.className = 'row' + (BLACK.includes(m % 12) ? ' black' : '');
    row.dataset.row = m;
    const lab = document.createElement('div');
    lab.className = 'lab';
    lab.textContent = midiName(m);
    row.appendChild(lab);
    const cells = document.createElement('div');
    cells.className = 'cells';
    for(let s = 0; s < ROLL_STEPS; s++){
      const c = document.createElement('button');
      c.type = 'button';
      c.className = 'cell' + (s % 4 === 0 ? ' beat' : '');
      c.dataset.midi = m;
      c.dataset.step = s;
      cells.appendChild(c);
    }
    row.appendChild(cells);
    rollBody.appendChild(row);
  }
  rollBody.appendChild(headLine);
  headLine.style.display = 'none';
}

const stepsHead = document.getElementById('rollsteps');
for(let s = 0; s < ROLL_STEPS; s++){
  const sp = document.createElement('span');
  sp.textContent = s + 1;
  if(s % 4 === 0) sp.className = 'beat';
  stepsHead.appendChild(sp);
}

/** 播一个绝对音高（不用音名，直接给 MIDI 号，所以任意音高都能响） */
function playMidi(m){
  const f = midiFreq(m);
  if(!CACHE[f]) CACHE[f] = render(f);
  const src = audio().createBufferSource();
  src.buffer = CACHE[f];
  src.connect(audio().destination);
  src.start();
  document.getElementById('rolllast').textContent = midiName(m) + ' · ' + f.toFixed(1) + ' Hz';
}

function flashRow(m){
  const row = rollBody.querySelector('.row[data-row="' + m + '"]');
  if(!row) return;
  row.classList.add('hit');
  setTimeout(() => row.classList.remove('hit'), 150);
}

/** 手指/鼠标落在格子上：写入音符并试听 */
function audition(m){
  flashRow(m);
  playMidi(m);
}

/**
 * 后台把当前音域的音高全部渲染好（一个音约 10ms，25 个音约 0.4s），
 * 分片跑，避免卡住界面。第一次点击后再开始，不然浏览器会警告 AudioContext 未授权。
 */
function prerender(){
  const token = ++preToken;
  const list = [];
  for(let i = 0; i < rollRows; i++) list.push(rollLow + i);
  const tag = document.getElementById('rollready');
  let k = 0;
  const chunk = () => {
    if(token !== preToken) return;
    const t0 = performance.now();
    while(k < list.length && performance.now() - t0 < 30){
      const f = midiFreq(list[k++]);
      if(!CACHE[f]) CACHE[f] = render(f);
    }
    tag.textContent = k < list.length ? '预渲染 ' + k + '/' + list.length : '音域已就绪';
    if(k < list.length) setTimeout(chunk, 0);
  };
  chunk();
}

function unlockAudio(){
  audio();
  if(!audioReady){ audioReady = true; prerender(); }
}

/* --- 格子交互 --- */
rollBody.addEventListener('pointerdown', (e) => {
  const cell = e.target.closest('.cell');
  if(!cell) return;
  e.preventDefault();
  unlockAudio();
  dragRow = +cell.dataset.midi;
  const key = cell.dataset.midi + ':' + cell.dataset.step;
  if(pattern[key]) delete pattern[key]; else pattern[key] = true;
  cell.classList.toggle('on', !!pattern[key]);
  audition(dragRow);
});

rollBody.addEventListener('pointermove', (e) => {
  if(dragRow === null) return;
  const el = document.elementFromPoint(e.clientX, e.clientY);
  const cell = el && el.closest ? el.closest('.cell') : null;
  if(!cell) return;
  const m = +cell.dataset.midi;
  if(m === dragRow) return;      // 只在换音高时才重新发声
  dragRow = m;
  audition(m);
});

document.addEventListener('pointerup', () => { dragRow = null; });
document.addEventListener('pointercancel', () => { dragRow = null; });

/* --- 循环播放 --- */
const playBtn = document.getElementById('rollplay');
const stepSec = () => 60 / rollBpm / 4;

function triggerStep(s){
  for(let i = 0; i < rollRows; i++){
    const m = rollLow + i;
    if(pattern[m + ':' + s]) playMidi(m);
  }
}

function setPlayhead(frac){
  headLine.style.display = 'block';
  headLine.style.left = (GUT + frac * (rollBody.clientWidth - GUT - 2)) + 'px';
}

function tickLoop(){
  if(!loopOn) return;
  const total = ROLL_STEPS * stepSec();
  const pos = Math.max(0, audio().currentTime - loopStart) % total;
  const s = Math.min(ROLL_STEPS - 1, Math.floor(pos / stepSec()));
  if(loopLast < 0){
    triggerStep(s);
  } else if(s !== loopLast){
    const gap = (s - loopLast + ROLL_STEPS) % ROLL_STEPS;
    // 掉帧或后台节流时不补发积压的音符，否则会一口气炸出来
    if(gap > 2) triggerStep(s);
    else for(let k = 1; k <= gap; k++) triggerStep((loopLast + k) % ROLL_STEPS);
  }
  loopLast = s;
  setPlayhead(pos / total);
}

function startLoop(){
  unlockAudio();
  loopOn = true;
  loopLast = -1;
  loopStart = audio().currentTime;
  playBtn.textContent = '停止';
  loopTimer = setInterval(tickLoop, 20);
  tickLoop();
}

function stopLoop(){
  loopOn = false;
  clearInterval(loopTimer);
  loopTimer = null;
  playBtn.textContent = '播放';
  headLine.style.display = 'none';
}

playBtn.onclick = () => { loopOn ? stopLoop() : startLoop(); };

document.getElementById('rollclear').onclick = () => {
  pattern = {};
  rollBody.querySelectorAll('.cell.on').forEach((c) => c.classList.remove('on'));
};

const bpmEl = document.getElementById('rollbpm');
const bpmTag = document.getElementById('rollbpmtag');
bpmEl.oninput = () => {
  rollBpm = +bpmEl.value;
  bpmTag.textContent = rollBpm + ' BPM · 每格 16 分音符';
  if(loopOn){ loopStart = audio().currentTime; loopLast = -1; }   // 改速度就从第 1 格重新开始
};

document.getElementById('rollrange').onchange = (e) => {
  stopLoop();
  rollLow = +e.target.value;
  pattern = {};                  // 音域换了，原来的音符在视野外，直接清掉，避免看不见还在响
  buildRoll();
  prerender();
};

/* --- 电脑键盘实时演奏 --- */
const KEYMAP = {};
[...KEY_LOW].forEach((k, i) => { KEYMAP[k] = i; });
[...KEY_HIGH].forEach((k, i) => { KEYMAP[k] = i + 12; });

document.addEventListener('keydown', (e) => {
  if(e.repeat || e.metaKey || e.ctrlKey || e.altKey) return;
  const tag = (e.target.tagName || '').toLowerCase();
  if(tag === 'input' || tag === 'textarea' || tag === 'select') return;
  const off = KEYMAP[e.key.toLowerCase()];
  if(off === undefined || off >= rollRows) return;
  e.preventDefault();
  unlockAudio();
  audition(rollLow + off);
});

buildRoll();

// 包络曲线
const cv = document.getElementById('cv'), g = cv.getContext('2d');
g.strokeStyle='#232b38'; g.beginPath(); g.moveTo(0,cv.height/2); g.lineTo(cv.width,cv.height/2); g.stroke();
g.beginPath(); g.strokeStyle='#7fd1ff'; g.lineWidth=3;
const dur = P.duration;
for(let x=0;x<cv.width;x++){
  const t = x/cv.width*dur;
  let v = P.fastPart*Math.exp(-t/P.fastTau)+(1-P.fastPart)*Math.exp(-t/P.slowTau);
  if(t<P.attack) v *= Math.pow(t/P.attack, P.attackCurve);
  const y = cv.height/2 - v*(cv.height*0.44);
  x===0 ? g.moveTo(x,y) : g.lineTo(x,y);
}
g.stroke();
</script>

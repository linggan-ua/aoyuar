<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>启动页回归测试</title>
<style>
  /* 黑底只能放在 html 上！放到 body 上会盖住 AR.js 那个 z-index:-2 的相机画面，
     表现就是"相机其实在播、界面也正常，但屏幕全黑"（老版本页面的 body 就没有背景色）*/
  html { background: #000; }
  body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    overflow: hidden;
    font: 14px/1.6 -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  /* AR 画面铺满：AR.js 的 video 自己会定位，这里保证 scene/canvas 跟着走 */
  a-scene { position: fixed; top: 0; left: 0; width: 100%; height: 100%; display: block; }
  .a-canvas { width: 100% !important; height: 100% !important; }
  /* 相机画面铺满屏幕。AR.js 自己也会做（按 videoWidth/Height 算出 cover 尺寸），但它依赖
     视频元数据，元数据没就绪时那套算出来是 NaN，画面就只占一块。这里用同样的 cover 语义
     直接写死，等价且不会失效。 */
  #arjs-video {
    position: fixed !important; top: 0 !important; left: 0 !important;
    width: 100% !important; height: 100% !important;
    margin: 0 !important; object-fit: cover; z-index: -2 !important;
  }
  /* AR.js 失败时自己会往 body 塞一个没样式的 #error-popup，统一走我们自己的提示卡 */
  #error-popup { display: none !important; }

  #ui { position: fixed; inset: 0; z-index: 10; pointer-events: none; }

  #hint {
    position: absolute; left: 50%; top: calc(18px + env(safe-area-inset-top));
    transform: translateX(-50%);
    padding: 8px 16px; border-radius: 999px;
    background: rgba(8, 11, 16, .62); color: #f4f7f8; font-size: 13px;
    white-space: nowrap; transition: opacity .5s ease;
  }
  #hint.hidden { opacity: 0; }

  /* 相机没起来／出错时的提示卡；空的时候不占位（AR.js 会往里写错误信息） */
  #ar-error:empty { display: none; }
  #ar-error {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    max-width: 82vw; padding: 18px 20px; border-radius: 14px;
    background: rgba(8, 11, 16, .9); border: 1px solid rgba(245, 194, 67, .5);
    color: #f4f7f8; font-size: 14px; line-height: 1.7; text-align: center;
    pointer-events: auto; white-space: pre-wrap;
  }

  /* ---------- 启动页（还原老版本：标题图 + 进入按钮）---------- */
  .start-overlay {
    position: fixed; inset: 0; z-index: 100;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 20px; padding: 24px 20px calc(24px + env(safe-area-inset-bottom));
    /* 底色取自标题图：近黑带一点墨绿 */
    background: radial-gradient(120% 90% at 50% 38%, #071712 0%, #020806 58%, #000 100%);
    color: #eaf6f1; text-align: center;
    pointer-events: auto;
    transition: opacity .45s ease, visibility .45s ease;
  }
  .start-overlay.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
  /* 启动页海报（竖版）：尽量放大到能看清上面的字，同时给下面的说明和按钮留位置 */
  #start-poster {
    max-height: 58vh; max-width: min(86vw, 420px); width: auto;
    filter: drop-shadow(0 12px 44px rgba(5, 248, 171, .16));
  }
  .start-tips { color: #9fb3a9; font-size: 13px; line-height: 1.9; }
  .start-tips b { color: #05f8ab; font-weight: 600; }
  #start-ar-button {
    min-width: min(78vw, 340px); padding: 17px 26px; border-radius: 999px;
    border: 1.5px solid rgba(5, 248, 171, .75);
    background: linear-gradient(180deg, rgba(5, 248, 171, .16), rgba(5, 248, 171, .05));
    color: #05f8ab; font-size: 17px; font-weight: 700; letter-spacing: .1em;
    font-family: inherit; cursor: pointer;
    box-shadow: inset 0 0 0 1px rgba(5, 248, 171, .12), 0 10px 34px rgba(5, 248, 171, .10);
    transition: transform .18s ease, box-shadow .25s ease, opacity .2s ease, color .2s ease;
  }
  #start-ar-button:active { transform: scale(.97); }
  #start-ar-button[disabled] {
    opacity: .5; border-color: rgba(159, 179, 169, .45); color: #9fb3a9; box-shadow: none; cursor: default;
  }
  .start-note { color: #6d7f77; font-size: 12px; }

  /* 只有 iOS / 微信这种"必须先有用户手势"的环境才会出现 */
  #tap-gate {
    position: absolute; inset: 0; display: none; flex-direction: column;
    align-items: center; justify-content: center; gap: 12px;
    background: rgba(0, 0, 0, .55); pointer-events: auto;
  }
  #tap-gate.show { display: flex; }
  #tap-gate .pill {
    padding: 15px 30px; border-radius: 999px;
    background: rgba(245, 194, 67, .94); color: #1a1206;
    font-size: 17px; font-weight: 700;
  }
  #tap-gate .note { color: rgba(244, 247, 248, .78); font-size: 12px; }

  /* 调试入口默认隐藏：只有带 ?debug=1 的链接（或页面自己声明 window.AOYU_DEBUG）才显示 */
  #debug-toggle {
    display: none;
    position: absolute; right: calc(14px + env(safe-area-inset-right));
    bottom: calc(16px + env(safe-area-inset-bottom));
    padding: 7px 12px; border-radius: 10px;
    border: 1px solid rgba(245, 194, 67, .5); background: rgba(8, 11, 16, .6);
    color: #f5c243; font-size: 12px; font-weight: 700;
    pointer-events: auto; opacity: .78;
  }
  body.aoyu-debug #debug-toggle { display: block; }
  #debug-panel {
    display: none;
    position: absolute; right: calc(14px + env(safe-area-inset-right));
    bottom: calc(58px + env(safe-area-inset-bottom));
    width: min(320px, 82vw); padding: 12px; border-radius: 14px;
    background: rgba(8, 11, 16, .88); border: 1px solid rgba(245, 194, 67, .5);
    color: #f4f7f8; pointer-events: auto;
  }
  #debug-panel.open { display: block; }
  .db-head { display: flex; align-items: center; justify-content: space-between; }
  .db-title { color: #f5c243; font-size: 13px; font-weight: 800; letter-spacing: .5px; }
  #debug-close { color: #25d7e8; font-size: 22px; line-height: 1; padding: 0 6px; }
  .db-time { color: #f5c243; font-size: 14px; font-weight: 700; text-align: center; margin-top: 4px; }
  .db-mode { color: #25d7e8; font-size: 12px; text-align: center; margin-bottom: 8px; }
  .db-row { display: flex; gap: 6px; margin: 6px 0; }
  .db-row button {
    flex: 1; padding: 7px 4px; border-radius: 8px; cursor: pointer;
    border: 1px solid rgba(244, 247, 248, .22); background: rgba(29, 38, 50, .9);
    color: #f4f7f8; font-size: 12px; font-family: inherit;
  }
  .db-row button.on { border-color: #f5c243; color: #f5c243; }
  .db-status { margin: 8px 0 4px; color: #8b98a9; font-size: 11px; line-height: 1.6; }
  .db-hint { margin-top: 6px; color: #5d6b7d; font-size: 11px; text-align: center; }
  #tap-gate { display: none !important; }
</style>
<!-- 子路径部署（GitHub Pages /aoyuar/）时保证 assets、.patt 相对当前目录解析 -->
<script>
(function () {
  var path = location.pathname;
  if (!path.endsWith('/')) {
    if (/\.[^/.]+$/.test(path)) path = path.replace(/[^/]+$/, '');
    else path += '/';
  }
  var base = document.createElement('base');
  base.href = location.origin + path;
  document.head.appendChild(base);
})();
</script>
<!-- 跟踪模式开关：默认走 AR.js pattern；带 ?tracker=image 时改用图像特征跟踪（js/image-tracker.js）
     必须在 A-Frame 解析 <a-scene> 之前改写标记，否则 arjs system 会先接管 -->
<script>
(function () {
  var useImageTracker = /(?:^|[?&])tracker=image(?:&|$)/.test(location.search);
  window.AOYU_USE_IMAGE_TRACKER = useImageTracker;
  window.AOYU_SKIP_CAMERA = useImageTracker;      // 相机由 image-tracker 自己开
  // 图像跟踪用的卡片参考图（默认值写死在 image-tracker.js 里，这里跟随 pattern 一起换）
  window.AOYU_TRACKER_CARD = 'assets/patterns/pattern-card-v4-track.png';
  if (!useImageTracker) return;
  document.addEventListener('DOMContentLoaded', function () {});
  var rewrite = function () {
    var marker = document.querySelector('a-marker');
    var scene = document.querySelector('a-scene');
    if (!marker || !scene) return false;
    var node = document.createElement('a-entity');
    node.id = 'ar-marker';
    while (marker.firstChild) node.appendChild(marker.firstChild);
    marker.parentNode.replaceChild(node, marker);
    scene.removeAttribute('arjs');
    console.log('AOYU_TRACKER_MODE image');
    return true;
  };
  // DOMContentLoaded 之前也试一次（脚本在 head 里，scene 可能还没解析）
  document.addEventListener('DOMContentLoaded', rewrite);
  window.__aoyuRewriteMarker = rewrite;
})();
</script>
<!-- A-Frame 和 AR.js 必须在 <a-scene> 之前加载：A-Frame 解析 scene 时要找已注册的 arjs system -->
<script src="../aframe.min.js"></script>
<script src="../aframe-ar.js"></script>
</head>
<body>

<a-scene id="ar-scene"
         embedded
         device-orientation-permission-ui="enabled: false"
         vr-mode-ui="enabled: false"
         renderer="colorManagement: true;"
         arjs="sourceType: image; sourceUrl: ../assets/patterns/pattern-card-v4.png; debugUIEnabled: false; patternRatio: 0.5; cameraParametersUrl: ../assets/arjs/camera_para.dat; errorPopup: ar-error; sourceWidth: 1920; sourceHeight: 1080">

  <a-assets timeout="30000">
    <a-asset-item id="aoyu-model" src="../assets/models/aoyu_ink.glb"></a-asset-item>
    <a-asset-item id="koi-model" src="../assets/models/koi_ink.glb"></a-asset-item>
  </a-assets>

  <!-- 性能：不要开 logarithmicDepthBuffer（会关掉早期深度测试优化）。
       识别频率和采集分辨率都用 AR.js 默认值，不人为限制。 -->
  <!-- renderer 必须带 colorManagement：A-Frame 1.3 默认不做 sRGB 输出，
       glTF 贴图会被当线性值写出去，整体明显偏暗（小程序那边是正常的色彩管理） -->
  <!-- 鳌鱼是 unlit 材质（水墨质感全靠贴图），锦鲤是普通材质，需要一点光 -->
  <a-entity light="type: ambient; color: #ffffff; intensity: 0.9"></a-entity>
  <a-entity light="type: directional; color: #fff5d6; intensity: 0.7" position="1.5 2 1"></a-entity>

  <!-- 识别用的 .patt：同名 .png 是要打印的卡片（黑方块占 80%、内图占黑方块 50%，
       所以 arjs 的 patternRatio 必须是 0.5；换卡就换这两个文件 + 下面这一行） -->
  <a-marker id="ar-marker" type="pattern" url="../assets/patterns/pattern-card-v4.patt"
            emitevents="true" size="1">

    <!-- 游动节点：位置和朝向每帧由 fish-swim 直接写 object3D，
         模型挂在下面，rotation="0 90 0" 让小程序的朝向约定（头朝局部 +Z）成立 -->
    <a-entity id="aoyu-swim" fish-swim="key: aoyu; anim: #aoyu-anim" scale="0.64 0.64 0.64">
      <a-entity id="aoyu-anim" fish-anim="clip: Ao_Swim_Loop_3.2s"
                gltf-model="#aoyu-model" rotation="0 90 0"></a-entity>
    </a-entity>

    <a-entity id="koi-swim" fish-swim="key: koi; anim: #koi-anim" scale="0.55 0.55 0.55">
      <a-entity id="koi-anim" fish-anim="clip: Swim_Loop_2.4s"
                gltf-model="#koi-model" rotation="0 90 0"></a-entity>
    </a-entity>

  </a-marker>

  <a-entity camera></a-entity>
</a-scene>

<div id="ui">
  <!-- 启动页（还原老版本）-->
  <div id="start-overlay" class="start-overlay">
    <img id="start-poster" src="../assets/ui/start-poster-v2.png" alt="水墨與絲竹的對話 · 沉浸式国乐剧场">
    <div class="start-tips">扫描<b>鳌鱼二维码</b>，在二维码上方查看<b>鳌鱼</b><br>首次进入请点击「允许/Allow」授权摄像头</div>
    <button id="start-ar-button" type="button" disabled>资源准备中…</button>
    <div class="start-note"> </div>
  </div>

  <div id="hint">正在打开相机…</div>
  <div id="tap-gate">
    <div class="pill">点击此处开启相机</div>
    <div class="note">请允许网页使用摄像头</div>
  </div>
  <div id="ar-error"></div>

  <div id="debug-toggle">调试</div>
  <div id="debug-panel">
    <div class="db-head">
      <span class="db-title">系统时间调试</span>
      <span id="debug-close">×</span>
    </div>
    <div id="debug-time" class="db-time"></div>
    <div id="debug-mode" class="db-mode"></div>

    <div class="db-row">
      <button id="db-m60">-1h</button>
      <button id="db-m10">-10m</button>
      <button id="db-m1">-1m</button>
      <button id="db-real">真实</button>
      <button id="db-p1">+1m</button>
      <button id="db-p10">+10m</button>
      <button id="db-p60">+1h</button>
    </div>
    <div class="db-row">
      <button id="db-1959">19:59:55</button>
      <button id="db-2001">20:01</button>
    </div>
    <div class="db-row">
      <button id="db-koi">强制锦鲤</button>
      <button id="db-aoyu">强制鳌鱼</button>
    </div>
    <div class="db-row">
      <button id="db-follow">跟随真实时间</button>
    </div>

    <div id="debug-anim" class="db-status"></div>
    <div id="debug-camera" class="db-status"></div>
    <div id="debug-status" class="db-status"></div>

    <div class="db-row">
      <button id="db-speed-m">速度-</button>
      <button id="db-speed-p">速度+</button>
      <button id="db-turn-m">转向-</button>
      <button id="db-turn-p">转向+</button>
    </div>
    <div class="db-row">
      <button id="db-range-m">范围-</button>
      <button id="db-range-p">范围+</button>
      <button id="db-tail-m">摆尾-</button>
      <button id="db-tail-p">摆尾+</button>
    </div>
    <div class="db-row">
      <button id="db-size-m">鱼小一点</button>
      <button id="db-size-p">鱼大一点</button>
      <button id="db-startle-m">惊吓-</button>
      <button id="db-startle-p">惊吓+</button>
    </div>
    <div class="db-row">
      <button id="db-material">材质：标准</button>
      <button id="db-hitbox">碰撞盒：关</button>
      <button id="db-adaptive">自适应：关</button>
    </div>
    <div class="db-row">
      <button id="db-anchor">锚点环</button>
      <button id="db-reset">恢复默认</button>
    </div>

    <div class="db-hint">只改页面内部的时间，不动手机系统时间</div>
  </div>
</div>

<script src="../js/fish-motion.js?v=10"></script>
<script>
  // image 模式下再加载跟踪器（它自己开相机、算位姿、写锚点矩阵，并派发 markerFound/markerLost）
  if (window.AOYU_USE_IMAGE_TRACKER) {
    // OpenCV.js 走多源加载器（官方 CDN 会间歇性给 Cloudflare 挑战页，见 js/opencv-loader.js）
    var l = document.createElement('script');
    l.src = 'js/opencv-loader.js?v=1';
    l.onload = function () {
      window.AOYU_LOAD_OPENCV(function (ok) { console.log('AOYU_TRACKER_MODE opencv 就绪=' + ok); });
      var t = document.createElement('script');
      t.src = 'js/image-tracker.js?v=21';   // 改 js/image-tracker.js 时这个数字要 +1：否则手机会用缓存里的旧算法
      document.body.appendChild(t);
    };
    l.onerror = function () { console.error('AOYU_TRACKER_MODE opencv-loader 没加载出来'); };
    document.body.appendChild(l);
  } else if (window.__aoyuRewriteMarker) {
    window.__aoyuRewriteMarker();   // AR.js 模式下不需要改写，保持原样
  }
</script>
<script>window.AOYU_DEBUG = true;   // 工具页始终显示调试入口</script>
<script src="../js/note-synth.js?v=1"></script>
<script src="../js/aoyu-ar.js?v=65"></script>
</body>
</html>

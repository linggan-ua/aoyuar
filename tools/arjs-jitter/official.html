<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Official AR.js 2.1.4 jitter probe</title>
<style>
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
  body { font: 12px/1.5 -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; }
  a-scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #probe {
    position: fixed; top: 12px; left: 12px; z-index: 20; max-width: calc(100vw - 24px);
    padding: 8px 10px; border-radius: 9px; color: #d9f5ff;
    background: rgba(6, 12, 18, .78); border: 1px solid rgba(120, 220, 255, .4);
    pointer-events: none; white-space: pre-wrap; font-family: ui-monospace, monospace;
  }
  #links {
    position: fixed; right: 12px; bottom: 12px; z-index: 20; display: flex; gap: 6px;
  }
  #links a, #links button {
    padding: 7px 10px; border-radius: 7px; border: 1px solid rgba(245,194,67,.6);
    background: rgba(8,11,16,.8); color: #f5c243; text-decoration: none; font: inherit;
  }
</style>
</head>
<body>
<script src="https://cdn.jsdelivr.net/npm/aframe@1.0.0/dist/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/gh/stemkoski/AR.js-examples@master/js/aframe-ar.js"></script>
<a-scene embedded vr-mode-ui="enabled: false"
         arjs="debugUIEnabled: false; patternRatio: 0.5; cameraParametersUrl: ../../assets/arjs/camera_para.dat">
  <a-marker id="ar-marker" type="pattern" url="../../assets/patterns/kanji.patt"
            smooth="false" emitevents="true" size="1">
    <a-box id="probe-cube" position="0 0.5 0"
           material="color: #ff8844; transparent: true; opacity: 0.35; wireframe: true"></a-box>
  </a-marker>
  <a-entity camera></a-entity>
</a-scene>
<div id="probe">等待 marker…</div>
<div id="links"><button id="reset-probe">重置抖动</button><a href="current.html">切到当前 3.4.7</a></div>
<script>
(function () {
  var marker = document.querySelector('#ar-marker');
  var out = document.querySelector('#probe');
  var samples = [];
  function sd(values) {
    if (values.length < 2) return 0;
    var mean = values.reduce(function (a, b) { return a + b; }, 0) / values.length;
    var sum = values.reduce(function (a, b) { return a + (b - mean) * (b - mean); }, 0);
    return Math.sqrt(sum / values.length);
  }
  function componentValues(items, index) {
    return items.map(function (item) { return item[index]; });
  }
  function tick() {
    if (!marker || !marker.object3D || !marker.object3D.visible) return;
    var q = marker.object3D.quaternion, p = marker.object3D.position;
    samples.push([q.x, q.y, q.z, q.w, p.x, p.y, p.z]);
    if (samples.length > 90) samples.shift();
    var qJitter = 0, pJitter = 0;
    for (var i = 0; i < 4; i++) qJitter += sd(componentValues(samples, i));
    for (var j = 4; j < 7; j++) pJitter += sd(componentValues(samples, j));
    out.textContent = 'MARKER JITTER PROBE\n' +
      'qΣσ=' + qJitter.toFixed(6) + '  pΣσ=' + pJitter.toFixed(6) +
      '\nq=' + [q.x, q.y, q.z, q.w].map(function (v) { return v.toFixed(4); }).join(',') +
      '\np=' + [p.x, p.y, p.z].map(function (v) { return v.toFixed(4); }).join(',') +
      '\nsamples=' + samples.length;
  }
  setInterval(tick, 50);
  document.getElementById('reset-probe').addEventListener('click', function () { samples = []; });
})();
</script>
</body>
</html>

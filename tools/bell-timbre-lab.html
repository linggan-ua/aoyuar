<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>温柔正弦铃 · 调音台</title>
<style>
  :root{
    --bg:#0b0e13; --panel:#141922; --line:#232b38; --text:#e8eef6; --dim:#8b98a9;
    --accent:#7fd1ff; --accent2:#ffd479;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
       font:14px/1.6 -apple-system,"PingFang SC","Helvetica Neue",sans-serif}
  header{padding:18px 24px;border-bottom:1px solid var(--line);display:flex;
         align-items:center;gap:16px;flex-wrap:wrap;position:sticky;top:0;
         background:rgba(11,14,19,.94);backdrop-filter:blur(8px);z-index:10}
  h1{font-size:16px;margin:0;font-weight:600;letter-spacing:.5px}
  .hint{color:var(--dim);font-size:12px}
  button{background:#1d2632;color:var(--text);border:1px solid var(--line);
         border-radius:8px;padding:8px 14px;font-size:13px;cursor:pointer}
  button:hover{border-color:var(--accent);color:var(--accent)}
  button.primary{background:var(--accent);color:#06202e;border-color:var(--accent);font-weight:600}
  main{display:grid;grid-template-columns:1fr 1fr;gap:18px;padding:18px 24px 60px;max-width:1200px}
  section{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px}
  section h2{font-size:13px;margin:0 0 14px;color:var(--accent);font-weight:600;letter-spacing:1px}
  .row{display:grid;grid-template-columns:110px 1fr 62px;align-items:center;gap:10px;margin:9px 0}
  .row label{color:var(--dim);font-size:12px}
  .row .val{text-align:right;font-variant-numeric:tabular-nums;color:var(--accent2);font-size:12px}
  input[type=range]{width:100%;accent-color:var(--accent);height:18px}
  input[type=number]{width:100%;background:#0e131b;color:var(--text);
    border:1px solid var(--line);border-radius:6px;padding:4px 6px;font-size:12px}
  canvas{width:100%;height:120px;background:#0e131b;border-radius:8px;border:1px solid var(--line)}
  pre{margin:0;background:#0e131b;border:1px solid var(--line);border-radius:8px;
      padding:12px;font-size:11px;color:#9fd3a0;overflow:auto;max-height:260px}
  .notes{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
  .notes button{width:46px;padding:8px 0;text-align:center}
  .wide{grid-column:1 / -1}
</style>
</head>
<body>
<header>
  <h1>温柔正弦铃 · 调音台</h1>
  <button class="primary" id="play">▶ 播放</button>
  <button id="scale">播放整条音阶</button>
  <button id="reset">重置默认</button>
  <button id="copy">复制参数 JSON</button>
  <span class="hint">改参数后按播放即可听；这里和微信小程序用的是同一套算法</span>
</header>
<main>
  <section>
    <h2>音高</h2>
    <div class="notes" id="keyboard"></div>
    <div class="row"><label>音区</label>
      <div id="octaves" style="display:flex;gap:8px"></div><span class="val"></span></div>
  </section>

  <section>
    <h2>音头（决定"硬"还是"软"）</h2>
    <div class="row"><label>起音</label><input type="range" id="attack" min="0.002" max="0.40" step="0.001"><span class="val"></span></div>
    <div class="row"><label>起音曲线</label><input type="range" id="attackCurve" min="0.5" max="5" step="0.05"><span class="val"></span></div>
    <div class="row"><label>滑音量</label><input type="range" id="bloomAmount" min="0" max="0.08" step="0.001"><span class="val"></span></div>
    <div class="row"><label>滑音时间</label><input type="range" id="bloomTau" min="0.005" max="0.40" step="0.001"><span class="val"></span></div>
  </section>

  <section>
    <h2>包络</h2>
    <div class="row"><label>快速段占比</label><input type="range" id="fastPart" min="0" max="1" step="0.01"><span class="val"></span></div>
    <div class="row"><label>快速衰减</label><input type="range" id="fastTau" min="0.03" max="2.0" step="0.01"><span class="val"></span></div>
    <div class="row"><label>慢速衰减</label><input type="range" id="slowTau" min="0.2" max="6" step="0.05"><span class="val"></span></div>
    <div class="row"><label>总时长</label><input type="range" id="duration" min="0.6" max="8" step="0.1"><span class="val"></span></div>
  </section>

  <section>
    <h2>空间（决定"空灵"）</h2>
    <div class="row"><label>干声电平</label><input type="range" id="dry" min="0" max="1.5" step="0.01"><span class="val"></span></div>
    <div class="row"><label>混响电平</label><input type="range" id="reverb" min="0" max="2" step="0.01"><span class="val"></span></div>
    <div class="row"><label>混响预延迟</label><input type="range" id="preDelay" min="0" max="0.3" step="0.005"><span class="val"></span></div>
    <div class="row"><label>混响尾巴长度</label><input type="range" id="reverbTail" min="0.2" max="4" step="0.05"><span class="val"></span></div>
    <div class="row"><label>混响密度</label><input type="range" id="reverbDensity" min="2" max="10" step="1"><span class="val"></span></div>
    <div class="row"><label>混响衰减</label><input type="range" id="reverbDecay" min="0.1" max="0.72" step="0.01"><span class="val"></span></div>
    <div class="row"><label>混响音色</label><input type="range" id="reverbTone" min="0" max="1" step="0.01"><span class="val"></span></div>
    <div class="row"><label>混响宽度</label><input type="range" id="reverbWidth" min="0" max="2" step="0.02"><span class="val"></span></div>
    <div class="row"><label>延迟扩散</label><input type="range" id="reverbSpread" min="0.2" max="4" step="0.05"><span class="val"></span></div>
    <div class="row"><label>左右失谐</label><input type="range" id="detune" min="0" max="0.006" step="0.00005"><span class="val"></span></div>
    <div class="row"><label>峰值电平</label><input type="range" id="peak" min="0.2" max="1" step="0.01"><span class="val"></span></div>
  </section>

  <section class="wide">
    <h2>分音（倍数 = 1 表示同频率叠加：只是多一条指数曲线来塑形，不产生新音高）</h2>
    <div class="row"><label>分音 2 倍数</label><input type="range" id="p2mult" min="1" max="6" step="0.01"><span class="val"></span></div>
    <div class="row"><label>分音 2 幅度</label><input type="range" id="p2amp" min="0" max="2" step="0.01"><span class="val"></span></div>
    <div class="row"><label>分音 3 倍数</label><input type="range" id="p3mult" min="1" max="8" step="0.01"><span class="val"></span></div>
    <div class="row"><label>分音 3 幅度</label><input type="range" id="p3amp" min="0" max="2" step="0.01"><span class="val"></span></div>
  </section>

  <section class="wide">
    <h2>波形包络（实时）</h2>
    <canvas id="wave" width="1100" height="240"></canvas>
  </section>

  <section class="wide">
    <h2>当前参数</h2>
    <pre id="json"></pre>
    <div class="row" style="grid-template-columns:auto 1fr auto;margin-top:12px">
      <label>粘贴参数</label>
      <input type="text" id="paste" placeholder='把之前复制的 JSON 粘到这里，回车应用'>
      <button id="apply">应用</button>
    </div>
    <div class="hint" style="color:#8b98a9;font-size:12px;margin-top:6px">
      调好的参数会自动记住，刷新页面也不丢。
    </div>
  </section>
</main>
<script>
const DEF = {
  root: 'C', octave: 6,
  attack: 0.020, attackCurve: 2.0, bloomAmount: 0.014, bloomTau: 0.040,
  fastPart: 0.58, fastTau: 0.22, slowTau: 0.90, duration: 2.4,
  detune: 0.00025, dry: 1.0, reverb: 1.0, preDelay: 0.0, reverbTail: 1.0,
  reverbDensity: 4, reverbDecay: 0.45, reverbTone: 0.7, reverbWidth: 1.0,
  reverbSpread: 1.0, peak: 0.92,
  p2mult: 2, p2amp: 0, p3mult: 3, p3amp: 0
};
const P = Object.assign({}, DEF);
try {
  const saved = JSON.parse(localStorage.getItem('bellLab') || 'null');
  if (saved) Object.assign(P, saved);
} catch (e) {}
function persist() { try { localStorage.setItem('bellLab', JSON.stringify(P)); } catch (e) {} }
const SEMI = { C: 0, 'C#': 1, D: 2, 'D#': 3, E: 4, F: 5, 'F#': 6, G: 7, 'G#': 8, A: 9, 'A#': 10, B: 11 };
const SCALE = ['C', 'D', 'E', 'G', 'A'];          // 宫商角徵羽
const REVERB_TAPS = [[0.037, 0.24], [0.061, 0.17], [0.089, 0.12], [0.131, 0.075], [0.177, 0.045]];

function freqOf(name, octave) {
  return 440 * Math.pow(2, (SEMI[name] + (octave + 1) * 12 - 69) / 12);
}

let ctx = null;
function audio() {
  if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
  if (ctx.state === 'suspended') ctx.resume();
  return ctx;
}

// 和小程序里 tools/make-scale-notes.py 相同的算法
function render(freq) {
  const sr = 44100, dur = P.duration;
  const n = Math.floor(sr * dur);
  const attack = Math.max(1, Math.floor(sr * P.attack));
  const release = Math.max(1, Math.floor(sr * 0.35));
  const L = new Float32Array(n), R = new Float32Array(n);
  let pl = 0, pr = 0;
  for (let i = 0; i < n; i++) {
    const t = i / sr;
    const decay = P.fastPart * Math.exp(-t / P.fastTau) + (1 - P.fastPart) * Math.exp(-t / P.slowTau);
    let env = 1;
    if (i < attack) env = Math.pow(i / attack, P.attackCurve);   // 指数越大，起音越渐进越柔
    if (i > n - release) env *= 0.5 - 0.5 * Math.cos(Math.PI * (n - i) / release);
    const r = t / P.bloomTau;
    const bloom = 1 + P.bloomAmount * r * Math.exp(1 - r);
    pl += 2 * Math.PI * freq * (1 - P.detune) * bloom / sr;
    pr += 2 * Math.PI * freq * (1 + P.detune) * bloom / sr;
    const a = decay * env;
    // 分音 2/3 也必须乘同一个总包络 env，否则它们一上来就是满幅 —— 那就是爆音来源
    let vl = Math.sin(pl) * a, vr = Math.sin(pr) * a;
    if (P.p2amp > 0) {
      const a2 = P.p2amp * Math.exp(-t / P.fastTau) * env;
      vl += a2 * Math.sin(pl * P.p2mult); vr += a2 * Math.sin(pr * P.p2mult);
    }
    if (P.p3amp > 0) {
      const a3 = P.p3amp * Math.exp(-t / P.slowTau) * env;
      vl += a3 * Math.sin(pl * P.p3mult); vr += a3 * Math.sin(pr * P.p3mult);
    }
    L[i] = vl; R[i] = vr;
  }
  // ---- 混响：多路递归延迟（能拖长尾巴），再经过音色/宽度塑形 ----
  if (P.reverb > 0 && (P.dry + P.reverb) > 0) {
    const wetL = new Float32Array(n), wetR = new Float32Array(n);
    const taps = Math.max(2, Math.round(P.reverbDensity));
    // 主延迟基数改短（原来 17~45ms × 扩散，配上 2.65 会拉到 119ms 以上）。
    // 长延迟 + 纯正弦会形成缓慢驻波，尾音就"发颤"；改短后干涉变密，听感是连续的雾。
    const base = (0.008 + 0.014 * P.reverbTail) * P.reverbSpread;
    for (let k = 0; k < taps; k++) {
      const d = Math.max(1, Math.floor(base * (1 + k * 0.41) * sr));
      const g = P.reverbDecay * (0.85 + 0.3 * ((k * 7) % 5) / 4);   // 每路略不同，避免同相
      for (let i = d; i < n; i++) {
        wetL[i] += (L[i - d] + wetL[i - d]) * g;
        wetR[i] += (R[i - d] + wetR[i - d]) * g;
      }
    }
    // 二次扩散：用**全通滤波器**（Schroeder allpass）把离散回声抹成连续尾巴。
    // 关键：全通的幅频响应是平的（只改相位、不染色），所以纯正弦扫过时
    // 不会出现"忽大忽小"的颤音 —— 用反馈梳状滤波器就会（上一版就是那个问题）。
    //   y[n] = -g·x[n] + x[n-D] + g·y[n-D]
    const DIFFUSE = [0.0043, 0.0067, 0.0091, 0.0127, 0.0173, 0.0229, 0.0281];
    for (let k = 0; k < DIFFUSE.length; k++) {
      const d = Math.max(1, Math.floor(DIFFUSE[k] * sr));
      const g = 0.62 - k * 0.04;
      const tl = Float32Array.from(wetL), tr = Float32Array.from(wetR);
      for (let i = d; i < n; i++) {
        wetL[i] = -g * tl[i] + tl[i - d] + g * wetL[i - d];
        wetR[i] = -g * tr[i] + tr[i - d] + g * wetR[i - d];
      }
    }
    // 音色：一阶低通，越暗越像大空间
    const cut = 300 + 12000 * P.reverbTone;
    const alpha = 1 - Math.exp(-2 * Math.PI * cut / sr);
    let sl = 0, sr2 = 0;
    const pre = Math.floor(P.preDelay * sr);
    const norm = 1 / Math.sqrt(taps);
    for (let i = 0; i < n; i++) {
      sl += alpha * (wetL[i] - sl);
      sr2 += alpha * (wetR[i] - sr2);
      let wl = sl * norm, wr = sr2 * norm;
      // 宽度：0 = 混响完全居中，1 = 保持，2 = 拉到更宽
      const mid = (wl + wr) / 2, side = (wl - wr) / 2 * P.reverbWidth;
      wl = mid + side; wr = mid - side;
      const idx = i + pre;
      if (idx < n) {
        L[idx] = L[idx] * P.dry + wl * P.reverb;
        R[idx] = R[idx] * P.dry + wr * P.reverb;
      }
    }
  } else {
    for (let i = 0; i < n; i++) { L[i] *= P.dry; R[i] *= P.dry; }
  }
  let pk = 0;
  for (let i = 0; i < n; i++) { pk = Math.max(pk, Math.abs(L[i]), Math.abs(R[i])); }
  const scale = pk > 0 ? P.peak / pk : 1;
  const buf = audio().createBuffer(2, n, sr);
  const cl = buf.getChannelData(0), cr = buf.getChannelData(1);
  for (let i = 0; i < n; i++) { cl[i] = L[i] * scale; cr[i] = R[i] * scale; }
  return buf;
}

function playNote(name) {
  const b = render(freqOf(name, P.octave));
  const src = audio().createBufferSource();
  src.buffer = b; src.connect(audio().destination); src.start();
}

// ---- UI ----
const rows = ['attack','attackCurve','bloomAmount','bloomTau','fastPart','fastTau','slowTau','duration',
              'detune','dry','reverb','preDelay','reverbTail','reverbDensity','reverbDecay','reverbTone',
              'reverbWidth','reverbSpread','peak','p2mult','p2amp','p3mult','p3amp'];
const fmt = {
  attack: v => (v*1000).toFixed(0)+' ms', attackCurve: v => '^'+v.toFixed(2),
  bloomAmount: v => (v*100).toFixed(1)+' %',
  bloomTau: v => (v*1000).toFixed(0)+' ms', fastPart: v => (v*100).toFixed(0)+' %',
  fastTau: v => v.toFixed(2)+' s', slowTau: v => v.toFixed(2)+' s', duration: v => v.toFixed(1)+' s',
  detune: v => (v*1000).toFixed(2)+' ‰', dry: v => (v*100).toFixed(0)+' %',
  reverb: v => (v*100).toFixed(0)+' %', preDelay: v => (v*1000).toFixed(0)+' ms',
  reverbTail: v => v.toFixed(2)+' ×', reverbDensity: v => v+' 路',
  reverbDecay: v => v.toFixed(2), reverbTone: v => (v*100).toFixed(0)+' %',
  reverbWidth: v => '×'+v.toFixed(2),
  reverbSpread: v => '×'+v.toFixed(2), peak: v => v.toFixed(2),
  p2mult: v => '×'+v.toFixed(2), p2amp: v => (v*100).toFixed(0)+' %',
  p3mult: v => '×'+v.toFixed(2), p3amp: v => (v*100).toFixed(0)+' %'
};
function syncUI() {
  for (const key of rows) {
    const el = document.getElementById(key);
    if (!el) continue;
    el.value = P[key];
    el.parentElement.querySelector('.val').textContent = fmt[key](P[key]);
  }
  document.getElementById('json').textContent = JSON.stringify(P, null, 2);
  drawWave();
}
function bind() {
  for (const key of rows) {
    const el = document.getElementById(key);
    if (!el) continue;
    el.addEventListener('input', () => { P[key] = parseFloat(el.value); persist(); syncUI(); });
  }
  document.getElementById('play').onclick = () => playNote(P.root);
  document.getElementById('scale').onclick = () => {
    SCALE.forEach((n, i) => setTimeout(() => playNote(n), i * 260));
  };
  document.getElementById('reset').onclick = () => { Object.assign(P, DEF); persist(); syncUI(); };
  document.getElementById('apply').onclick = () => {
    const box = document.getElementById('paste');
    try {
      const obj = JSON.parse(box.value);
      Object.keys(DEF).forEach(k => { if (typeof obj[k] === 'number') P[k] = obj[k]; });
      box.value = '';
      persist(); syncUI();
      document.getElementById('apply').textContent = '已应用 ✓';
      setTimeout(() => document.getElementById('apply').textContent = '应用', 1200);
    } catch (e) {
      box.value = 'JSON 解析失败：' + e.message;
    }
  };
  document.getElementById('paste').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') document.getElementById('apply').click();
  });
  document.getElementById('copy').onclick = () => {
    navigator.clipboard.writeText(JSON.stringify(P, null, 2));
    document.getElementById('copy').textContent = '已复制 ✓';
    setTimeout(() => document.getElementById('copy').textContent = '复制参数 JSON', 1200);
  };
  const kb = document.getElementById('keyboard');
  SCALE.forEach(n => {
    const b = document.createElement('button');
    b.textContent = n + P.octave;
    b.onclick = () => { P.root = n; playNote(n); syncUI(); };
    kb.appendChild(b);
  });
  const oc = document.getElementById('octaves');
  [5,6,7].forEach(o => {
    const b = document.createElement('button');
    b.textContent = 'C' + o;
    b.onclick = () => { P.octave = o; [...oc.children].forEach(c => c.style.color = ''); b.style.color = 'var(--accent)'; playNote(P.root); syncUI(); };
    if (o === P.octave) b.style.color = 'var(--accent)';
    oc.appendChild(b);
  });
}

function drawWave() {
  const c = document.getElementById('wave'), g = c.getContext('2d');
  const W = c.width, H = c.height;
  g.clearRect(0, 0, W, H);
  g.strokeStyle = '#232b38'; g.beginPath(); g.moveTo(0, H/2); g.lineTo(W, H/2); g.stroke();
  g.beginPath(); g.strokeStyle = '#7fd1ff'; g.lineWidth = 2;
  for (let x = 0; x < W; x++) {
    const t = x / W * P.duration;
    let v = P.fastPart * Math.exp(-t / P.fastTau) + (1 - P.fastPart) * Math.exp(-t / P.slowTau);
    if (t < P.attack) v *= Math.pow(t / P.attack, P.attackCurve);
    const y = H/2 - v * (H*0.44);
    x === 0 ? g.moveTo(x, y) : g.lineTo(x, y);
  }
  g.stroke();
}
bind(); syncUI();
</script>
</body>
</html>

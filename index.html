<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>鲤鱼 AR</title>
<style>
  /* 黑底只能放在 html 上！放到 body 上会盖住 AR.js 那个 z-index:-2 的相机画面，
     表现就是"相机其实在播、界面也正常，但屏幕全黑"（老版本页面的 body 就没有背景色）*/
  html { background: #000; }
  body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    overflow: hidden;
    font: 14px/1.6 -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  /* AR 画面铺满：AR.js 的 video 自己会定位，这里保证 scene/canvas 跟着走 */
  a-scene { position: fixed; top: 0; left: 0; width: 100%; height: 100%; display: block; z-index: 1; }
  /* 相机画面铺满屏幕。AR.js 自己也会做（按 videoWidth/Height 算出 cover 尺寸），但它依赖
     视频元数据，元数据没就绪时那套算出来是 NaN，画面就只占一块。这里用同样的 cover 语义
     直接写死，等价且不会失效。 */
  /* 相机画面层：用显式正层级（0），AR 画面（a-scene）在它上面（1）。
     以前这里用 z-index:-2 + 依赖"根背景先画"的顺序，PC Chrome 全屏（top layer）下
     这个顺序会变，相机会掉到黑色 backdrop 后面，表现就是全屏后整页黑。 */
  #arjs-video {
    position: fixed !important; top: 0 !important; left: 0 !important;
    z-index: 0 !important;
  }
  /* AR.js 失败时自己会往 body 塞一个没样式的 #error-popup，统一走我们自己的提示卡 */
  #error-popup { display: none !important; }

  #ui { position: fixed; inset: 0; z-index: 10; pointer-events: none; }

  #hint {
    position: absolute; left: 50%; top: calc(18px + env(safe-area-inset-top));
    transform: translateX(-50%);
    padding: 8px 16px; border-radius: 999px;
    background: rgba(8, 11, 16, .62); color: #f4f7f8; font-size: 13px;
    white-space: nowrap; transition: opacity .5s ease;
  }
  #hint.hidden { opacity: 0; }

  /* 相机没起来／出错时的提示卡；空的时候不占位（AR.js 会往里写错误信息） */
  #ar-error:empty { display: none; }
  #ar-error {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    max-width: 82vw; padding: 18px 20px; border-radius: 14px;
    background: rgba(8, 11, 16, .9); border: 1px solid rgba(245, 194, 67, .5);
    color: #f4f7f8; font-size: 14px; line-height: 1.7; text-align: center;
    pointer-events: auto; white-space: pre-wrap;
  }

  /* ---------- 启动页：稻田国潮音乐节纸艺拼贴风 ---------- */
  .start-overlay {
    position: fixed; inset: 0; z-index: 100;
    display: flex; align-items: center; justify-content: center;
    padding: calc(18px + env(safe-area-inset-top)) 16px calc(20px + env(safe-area-inset-bottom));
    overflow: hidden;
    background:
      radial-gradient(circle at 50% 12%, rgba(255,255,255,.82) 0 5%, rgba(255,255,255,0) 42%),
      linear-gradient(145deg, #ffb3b4 0%, #8fd8ea 22%, #b9f1e9 46%, #94c9ff 67%, #d5a9e7 100%);
    color: #fff; text-align: center; pointer-events: auto;
    transition: opacity .45s ease, visibility .45s ease;
  }
  .start-overlay::before {
    content: ""; position: absolute; inset: 0; z-index: 1; pointer-events: none;
    opacity: .17; mix-blend-mode: soft-light;
    background-image:
      radial-gradient(circle at 20% 30%, #fff 0 1px, transparent 1.5px),
      radial-gradient(circle at 70% 65%, #2b236d 0 1px, transparent 1.5px);
    background-size: 18px 18px, 23px 23px;
  }
  .start-overlay.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
  .festival-scene { position: absolute; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
  .paper-ribbon {
    position: absolute; border-radius: 999px; opacity: .84;
    border-top: 2px solid rgba(255,255,255,.6);
    box-shadow: inset 0 3px 0 rgba(255,255,255,.22), 0 10px 24px rgba(61,38,139,.16);
  }
  .ribbon-a { width: 82vw; height: 15vh; left: -24vw; top: -8vh; transform: rotate(9deg); background: linear-gradient(120deg, #f8a9a5, #ffd9b7); }
  .ribbon-b { width: 78vw; height: 13vh; right: -27vw; top: 2vh; transform: rotate(-12deg); background: linear-gradient(120deg, #d7b7f4, #91dce6); }
  .ribbon-c { width: 54vw; height: 9vh; left: -18vw; top: 24vh; transform: rotate(-9deg); background: linear-gradient(120deg, #7adce8, #c9f4de); opacity: .55; }
  .music-note {
    position: absolute; color: #4a2b9a; opacity: .72; font: 900 30px/1 "Songti SC", serif;
    text-shadow: 0 2px 0 rgba(255,255,255,.75); animation: festivalFloat 4.8s ease-in-out infinite;
  }
  .note-a { left: 7%; top: 23%; transform: rotate(-12deg); }
  .note-b { right: 8%; top: 18%; font-size: 38px; color: #e03d7a; animation-delay: -1.8s; transform: rotate(12deg); }
  .note-c { right: 16%; top: 40%; font-size: 24px; color: #2a80d2; animation-delay: -3.2s; }
  .sparkle { position: absolute; width: 12px; height: 12px; background: #fff8c9; transform: rotate(45deg); border-radius: 2px; box-shadow: 0 0 18px rgba(255,255,255,.9); opacity: .9; }
  .sparkle-a { left: 15%; top: 39%; }
  .sparkle-b { right: 13%; top: 31%; width: 8px; height: 8px; }
  .sparkle-c { left: 23%; top: 12%; width: 7px; height: 7px; }
  @keyframes festivalFloat { 0%, 100% { margin-top: 0; } 50% { margin-top: -10px; } }

  .festival-frame {
    position: relative; z-index: 4; width: min(92vw, 460px); box-sizing: border-box;
    padding: 18px 18px 16px; border-radius: 28px 28px 34px 24px;
    background: linear-gradient(155deg, rgba(249,255,255,.84), rgba(227,244,255,.66));
    border: 2px solid rgba(255,255,255,.9);
    box-shadow:
      0 14px 0 rgba(55,35,145,.18),
      0 28px 56px rgba(55,35,145,.32),
      inset 0 1px 0 #fff,
      inset 0 -1px 0 rgba(88,63,165,.18);
    backdrop-filter: blur(12px) saturate(1.18);
    -webkit-backdrop-filter: blur(12px) saturate(1.18);
  }
  .festival-topline { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .festival-pill, .festival-ar-pill {
    display: inline-flex; align-items: center; justify-content: center;
    padding: 6px 10px; border-radius: 999px; font-size: 11px; font-weight: 900; letter-spacing: .08em;
    box-shadow: 0 3px 0 rgba(54,34,132,.55), 0 7px 14px rgba(54,34,132,.14);
  }
  .festival-pill { color: #fff; background: linear-gradient(100deg, #178ed0, #6f48e6); transform: rotate(-2deg); }
  .festival-ar-pill { color: #3a257e; background: linear-gradient(180deg, #ffe96a, #ffc940); transform: rotate(2deg); }
  .festival-kicker {
    margin: 14px 0 7px; display: flex; align-items: center; justify-content: center; gap: 8px;
    color: #43238f; font-size: 12px; font-weight: 900; letter-spacing: .14em;
  }
  .festival-eq { display: inline-flex; align-items: flex-end; gap: 2px; height: 15px; }
  .festival-eq i { width: 3px; border-radius: 99px; background: #7543df; animation: festivalEq 1s ease-in-out infinite alternate; }
  .festival-eq i:nth-child(1) { height: 7px; }
  .festival-eq i:nth-child(2) { height: 14px; animation-delay: -.4s; }
  .festival-eq i:nth-child(3) { height: 10px; animation-delay: -.7s; }
  @keyframes festivalEq { to { transform: scaleY(.42); opacity: .62; } }
  .festival-title {
    margin: 0; font-family: "STKaiti", "Kaiti SC", "KaiTi", "Songti SC", serif;
    font-size: clamp(38px, 10.8vw, 58px); line-height: .93; font-weight: 900;
    letter-spacing: .015em; color: #fff; transform: rotate(-1.2deg);
  }
  .festival-title span {
    display: block; -webkit-text-stroke: 1.8px #342079; paint-order: stroke fill;
    text-shadow: 0 3px 0 #8050df, 0 6px 0 #2d1975, 0 11px 18px rgba(47,25,112,.27);
  }
  .festival-title span + span { margin-top: 4px; color: #f8ffff; font-size: 1.04em; }
  .festival-en {
    margin: 9px auto 12px; max-width: 310px; color: #53398f;
    font-size: 9px; line-height: 1.45; font-weight: 900; letter-spacing: .16em;
  }
  .festival-scan-card {
    position: relative; display: flex; align-items: center; gap: 10px; text-align: left;
    margin: 0 auto 15px; padding: 9px 13px; border-radius: 14px;
    color: #3c3275; background: rgba(255,255,255,.72);
    border: 1px dashed rgba(94,61,174,.36);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.9), 0 3px 10px rgba(53,35,138,.09);
    overflow: hidden;
  }
  .festival-scan-card::after {
    content: ""; position: absolute; right: -14px; top: -26px; width: 72px; height: 72px;
    border: 14px solid rgba(108,74,198,.08); border-radius: 50%;
  }
  .scan-icon {
    flex: 0 0 38px; width: 38px; height: 38px; border-radius: 12px;
    display: grid; place-items: center; color: #fff;
    background: linear-gradient(145deg, #21c5da, #5f58e6 70%, #8d46d7);
    font: 900 23px/1 "Songti SC", serif;
    box-shadow: inset 0 -3px 0 rgba(52,32,125,.22), 0 3px 7px rgba(62,43,143,.18);
  }
  .scan-copy { display: flex; flex-direction: column; min-width: 0; }
  .scan-copy small { color: #706c91; font-size: 10px; letter-spacing: .08em; }
  .scan-copy strong { color: #38257e; font-size: 14px; letter-spacing: .03em; }
  .scan-music { margin-left: auto; color: #a27adf; font-size: 25px; opacity: .72; }
  .start-action { position: relative; width: min(100%, 320px); margin: 0 auto; }
  .tap-guide {
    position: absolute; right: 5px; top: -24px; z-index: 2; display: flex; align-items: center; gap: 2px;
    color: #51258f; font-size: 11px; font-weight: 900; letter-spacing: .08em;
    animation: tapGuide 1.25s ease-in-out infinite; pointer-events: none;
  }
  .tap-finger { display: inline-block; font-size: 22px; line-height: 1; filter: drop-shadow(0 2px 0 rgba(255,255,255,.9)); transform-origin: 50% 100%; }
  @keyframes tapGuide {
    0%, 100% { transform: translateY(0) rotate(-5deg); opacity: .82; }
    45% { transform: translateY(-6px) rotate(-5deg); opacity: 1; }
    62% { transform: translateY(1px) rotate(-5deg); opacity: 1; }
  }
  #start-ar-button {
    position: relative; width: 100%; min-width: 0; padding: 16px 18px; border-radius: 16px;
    border: 3px solid rgba(255,255,255,.98);
    background: linear-gradient(180deg, #fff77c 0%, #ffd84d 46%, #ffab32 100%);
    color: #3e2079; font-size: 18px; font-weight: 900; letter-spacing: .08em;
    font-family: inherit; cursor: pointer; text-shadow: 0 1px 0 rgba(255,255,255,.72);
    box-shadow:
      0 8px 0 #6b2d9d,
      0 16px 30px rgba(60,31,129,.34),
      inset 0 3px 0 rgba(255,255,255,.74);
    animation: ctaPulse 2s ease-in-out infinite;
    overflow: hidden;
    transition: transform .18s ease, box-shadow .25s ease, opacity .2s ease, filter .2s ease;
  }
  #start-ar-button::after {
    content: ""; position: absolute; top: -45%; left: -35%; width: 32%; height: 190%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,.78), transparent);
    transform: rotate(20deg); animation: ctaShine 2.8s ease-in-out infinite;
  }
  @keyframes ctaPulse {
    0%, 100% { box-shadow: 0 8px 0 #6b2d9d, 0 16px 30px rgba(60,31,129,.34), 0 0 0 0 rgba(255,225,74,.55), inset 0 3px 0 rgba(255,255,255,.74); }
    50% { box-shadow: 0 8px 0 #6b2d9d, 0 18px 34px rgba(60,31,129,.4), 0 0 0 10px rgba(255,225,74,0), inset 0 3px 0 rgba(255,255,255,.74); }
  }
  @keyframes ctaShine { 0%, 34% { left: -45%; } 60%, 100% { left: 118%; } }
  #start-ar-button:active {
    transform: translateY(6px) scale(.985); animation: none;
    box-shadow: 0 2px 0 #6b2d9d, 0 6px 14px rgba(46,29,132,.26), inset 0 2px 0 rgba(255,255,255,.55);
  }
  #start-ar-button[disabled] {
    opacity: .56; cursor: default; filter: grayscale(.45); animation: none;
    box-shadow: 0 4px 0 rgba(48,32,120,.6);
  }
  #start-ar-button[disabled]::after { display: none; }
  .start-privacy { display: block; margin-top: 12px; color: #47366f; font-size: 10.5px; line-height: 1.55; font-weight: 700; }
  .start-note { position: absolute; left: 50%; bottom: calc(8px + env(safe-area-inset-bottom)); transform: translateX(-50%); z-index: 6; color: rgba(44,30,103,.66); font-size: 11px; white-space: nowrap; }
  .start-note b { color: #342079; font-weight: 900; }
  @media (pointer: coarse) { .start-note { display: none; } }

  .festival-landscape { position: absolute; left: -5%; right: -5%; bottom: 0; height: 39vh; min-height: 230px; z-index: 2; overflow: hidden; pointer-events: none; }
  .festival-wave {
    position: absolute; left: -14%; width: 128%; border-radius: 50% 50% 0 0 / 30% 30% 0 0;
    border-top: 2px solid rgba(255,255,255,.45); transform-origin: center bottom;
    box-shadow: 0 -7px 0 rgba(255,255,255,.12), 0 -16px 26px rgba(53,37,143,.14);
  }
  .wave-back { height: 52%; bottom: 17%; transform: rotate(-3deg); background: linear-gradient(180deg, #ffd5ba, #f5a99f); }
  .wave-mid { height: 54%; bottom: 5%; transform: rotate(2deg); background: linear-gradient(180deg, #94e0d5, #42b9c6 55%, #3689cd); }
  .wave-front { height: 46%; bottom: -13%; transform: rotate(-1deg); background: linear-gradient(180deg, #e5b4e7, #b96dd7 52%, #784fbe); }
  .wave-lines { position: absolute; left: 12%; right: 12%; bottom: 16%; height: 13%; opacity: .5; border-radius: 50%; background: repeating-linear-gradient(98deg, transparent 0 14px, rgba(255,255,255,.58) 15px 18px, transparent 19px 32px); transform: rotate(-2deg); }
  .rice-frame { position: absolute; left: -2%; right: -2%; bottom: -4%; width: 104%; height: 92%; overflow: visible; filter: drop-shadow(0 8px 10px rgba(73,48,16,.16)); }

  @media (max-height: 700px) {
    .festival-frame { padding: 15px 15px 13px; }
    .festival-kicker { margin-top: 10px; }
    .festival-title { font-size: clamp(34px, 9.8vw, 48px); }
    .festival-en { margin: 7px auto 9px; }
    .festival-scan-card { margin-bottom: 12px; padding: 7px 12px; }
    #start-ar-button { padding: 12px 16px; }
    .start-privacy { margin-top: 9px; font-size: 10px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .music-note, .festival-eq i, .tap-guide, #start-ar-button, #start-ar-button::after { animation: none !important; }
  }

  /* 只有 iOS / 微信这种"必须先有用户手势"的环境才会出现 */
  #tap-gate {
    position: absolute; inset: 0; display: none; flex-direction: column;
    align-items: center; justify-content: center; gap: 12px;
    background: rgba(0, 0, 0, .55); pointer-events: auto;
  }
  #tap-gate.show { display: flex; }
  #tap-gate .pill {
    padding: 15px 30px; border-radius: 999px;
    background: rgba(245, 194, 67, .94); color: #1a1206;
    font-size: 17px; font-weight: 700;
  }
  #tap-gate .note { color: rgba(244, 247, 248, .78); font-size: 12px; }

  /* 调试入口默认隐藏：只有带 ?debug=1 的链接（或页面自己声明 window.AOYU_DEBUG）才显示 */
  #debug-toggle {
    display: none;
    position: absolute; right: calc(14px + env(safe-area-inset-right));
    bottom: calc(16px + env(safe-area-inset-bottom));
    padding: 7px 12px; border-radius: 10px;
    border: 1px solid rgba(245, 194, 67, .5); background: rgba(8, 11, 16, .6);
    color: #f5c243; font-size: 12px; font-weight: 700;
    pointer-events: auto; opacity: .78;
  }
  body.aoyu-debug #debug-toggle { display: block; }
  #debug-panel {
    display: none;
    position: absolute; right: calc(14px + env(safe-area-inset-right));
    bottom: calc(58px + env(safe-area-inset-bottom));
    width: min(320px, 82vw); padding: 0 12px 12px; border-radius: 14px;
    box-sizing: border-box;
    max-height: calc(100vh - 84px);
    max-height: calc(100dvh - 84px - env(safe-area-inset-top) - env(safe-area-inset-bottom));
    overflow-x: hidden; overflow-y: auto;
    overscroll-behavior: contain; -webkit-overflow-scrolling: touch; touch-action: pan-y;
    background: rgba(8, 11, 16, .88); border: 1px solid rgba(245, 194, 67, .5);
    color: #f4f7f8; pointer-events: auto;
  }
  #debug-panel.open { display: block; }
  #debug-panel::-webkit-scrollbar { width: 6px; }
  #debug-panel::-webkit-scrollbar-thumb { background: rgba(245, 194, 67, .45); border-radius: 999px; }
  .db-head {
    position: sticky; top: 0; z-index: 3;
    display: flex; align-items: center; justify-content: space-between;
    margin: 0 -12px 4px; padding: 12px 12px 8px;
    background: rgba(8, 11, 16, .98); border-radius: 13px 13px 0 0;
  }
  .db-title { color: #f5c243; font-size: 13px; font-weight: 800; letter-spacing: .5px; }
  #debug-close { color: #25d7e8; font-size: 22px; line-height: 1; padding: 0 6px; }
  .db-time { color: #f5c243; font-size: 14px; font-weight: 700; text-align: center; margin-top: 4px; }
  .db-mode { color: #25d7e8; font-size: 12px; text-align: center; margin-bottom: 8px; }
  .db-row { display: flex; gap: 6px; margin: 6px 0; }
  .db-row button {
    flex: 1; padding: 7px 4px; border-radius: 8px; cursor: pointer;
    border: 1px solid rgba(244, 247, 248, .22); background: rgba(29, 38, 50, .9);
    color: #f4f7f8; font-size: 12px; font-family: inherit;
  }
  .db-row button.on { border-color: #f5c243; color: #f5c243; }
  .db-row button:disabled { opacity: .34; cursor: not-allowed; }
  .db-status { margin: 8px 0 4px; color: #8b98a9; font-size: 11px; line-height: 1.6; }
  .db-hint { margin-top: 6px; color: #5d6b7d; font-size: 11px; text-align: center; }
</style>
<!-- 子路径部署（GitHub Pages /aoyuar/）时保证 assets、.patt 相对当前目录解析 -->
<script>
(function () {
  var path = location.pathname;
  if (!path.endsWith('/')) {
    if (/\.[^/.]+$/.test(path)) path = path.replace(/[^/]+$/, '');
    else path += '/';
  }
  var base = document.createElement('base');
  base.href = location.origin + path;
  document.head.appendChild(base);
})();
</script>
<!-- 跟踪模式开关：默认走 AR.js pattern；带 ?tracker=image 时改用图像特征跟踪（js/image-tracker.js）
     必须在 A-Frame 解析 <a-scene> 之前改写标记，否则 arjs system 会先接管 -->
<script>
(function () {
  var useImageTracker = /(?:^|[?&])tracker=image(?:&|$)/.test(location.search);
  window.AOYU_USE_IMAGE_TRACKER = useImageTracker;
  window.AOYU_SKIP_CAMERA = useImageTracker;      // 相机由 image-tracker 自己开
  // 图像跟踪用的卡片参考图（默认值写死在 image-tracker.js 里，这里跟随 pattern 一起换）
  window.AOYU_TRACKER_CARD = 'assets/patterns/pattern-koi-red-white.png';
  if (!useImageTracker) return;
  document.addEventListener('DOMContentLoaded', function () {});
  var rewrite = function () {
    var marker = document.querySelector('a-marker');
    var scene = document.querySelector('a-scene');
    if (!marker || !scene) return false;
    var node = document.createElement('a-entity');
    node.id = 'ar-marker';
    while (marker.firstChild) node.appendChild(marker.firstChild);
    marker.parentNode.replaceChild(node, marker);
    scene.removeAttribute('arjs');
    console.log('AOYU_TRACKER_MODE image');
    return true;
  };
  // DOMContentLoaded 之前也试一次（脚本在 head 里，scene 可能还没解析）
  document.addEventListener('DOMContentLoaded', rewrite);
  window.__aoyuRewriteMarker = rewrite;
})();
</script>

<body>

<a-scene id="ar-scene"
         embedded
         keyboard-shortcuts="enterVR: false; exitVR: false"
         device-orientation-permission-ui="enabled: true; deviceMotionMessage: 此网站需要访问你的设备运动传感器，以进入增强现实体验。; httpsMessage: 请通过 HTTPS 访问本网站，才能进入增强现实并授权设备传感器。; denyButtonText: 拒绝; allowButtonText: 允许; cancelButtonText: 取消"
         vr-mode-ui="enabled: false"
         renderer="colorManagement: true;"
         arjs="sourceType: webcam; debugUIEnabled: false; patternRatio: 0.5; cameraParametersUrl: assets/arjs/camera_para.dat; errorPopup: ar-error">

  <a-assets timeout="30000">
    <a-asset-item id="koi-model" src="assets/models/koi_red.glb"></a-asset-item>
  </a-assets>

  <!-- 性能：不要开 logarithmicDepthBuffer（会关掉早期深度测试优化）。
       识别频率和采集分辨率都用 AR.js 默认值，不人为限制。 -->
  <!-- renderer 必须带 colorManagement：A-Frame 1.3 默认不做 sRGB 输出，
       glTF 贴图会被当线性值写出去，整体明显偏暗（小程序那边是正常的色彩管理） -->
  <!-- 鳌鱼是 unlit 材质（水墨质感全靠贴图），鲤鱼是普通材质，需要一点光 -->
  <a-entity light="type: ambient; color: #ffffff; intensity: 0.9"></a-entity>
  <a-entity light="type: directional; color: #fff5d6; intensity: 0.7" position="1.5 2 1"></a-entity>

  <!-- 当前红白鲤鱼识别码；同名 .png 是要打印的卡片（黑方块占 80%、内图占黑方块 50%，
       所以 arjs 的 patternRatio 必须是 0.5；换卡就换这两个文件 + 下面这一行） -->
  <!-- AR.js 原生 marker 矩阵平滑：只稳定现实锚点和鱼缸坐标，不改鱼的游动/转向算法。 -->
  <a-marker id="ar-marker" min-confidence="0.6" smooth="true" smooth-count="7" smooth-tolerance="0.01" smooth-threshold="2" type="pattern" url="assets/patterns/pattern-koi-red-white.patt"
            emitevents="true" size="1">

    <!-- 调试鱼缸：和官方 AR.js cubemap demo 一样直接挂在 marker 下。
         父节点只做 position/scale，尺寸由三维编辑器同步写入。 -->
    <a-box id="debug-tank" visible="false" rotation="-90 0 0" position="0 0.25 0" scale="0.80 0.56 0.50" tank-cube="base: assets/cube-faces/; opacity: 0.25"></a-box>

    <!-- 游动节点：位置和朝向每帧由 fish-swim 直接写 object3D，
         模型挂在下面，rotation="0 90 0" 让小程序的朝向约定（头朝局部 +Z）成立 -->

    <a-entity id="koi-swim" fish-swim="key: koi; anim: #koi-anim" scale="0.46 0.46 0.46">
      <a-entity id="koi-anim" fish-anim="clip: Feixia_Swim_Loop_2.8s"
                gltf-model="#koi-model" rotation="0 90 0"></a-entity>
    </a-entity>

    <!-- 第二条鲤鱼：同一份 glb 资源，另一套游动/骨骼动画实例，互相之间不撞车 -->
    <a-entity id="koi2-swim" fish-swim="key: koi2; anim: #koi2-anim" scale="0.46 0.46 0.46">
      <a-entity id="koi2-anim" fish-anim="clip: Feixia_Swim_Loop_2.8s"
                gltf-model="#koi-model" rotation="0 90 0"></a-entity>
    </a-entity>

  </a-marker>

  <a-entity camera></a-entity>
</a-scene>

<script>
  // image 模式下再加载跟踪器（它自己开相机、算位姿、写锚点矩阵，并派发 markerFound/markerLost）
  if (window.AOYU_USE_IMAGE_TRACKER) {
    // OpenCV.js 走多源加载器（官方 CDN 会间歇性给 Cloudflare 挑战页，见 js/opencv-loader.js）
    var l = document.createElement('script');
    l.src = 'js/opencv-loader.js?v=2';
    l.onload = function () {
      window.AOYU_LOAD_OPENCV(function (ok) { console.log('AOYU_TRACKER_MODE opencv 就绪=' + ok); });
      var t = document.createElement('script');
      t.src = 'js/image-tracker.js?v=24';   // 改 js/image-tracker.js 时这个数字要 +1：否则手机会用缓存里的旧算法
      document.body.appendChild(t);
    };
    l.onerror = function () { console.error('AOYU_TRACKER_MODE opencv-loader 没加载出来'); };
    document.body.appendChild(l);
  } else if (window.__aoyuRewriteMarker) {
    window.__aoyuRewriteMarker();   // AR.js 模式下不需要改写，保持原样
  }
</script>
